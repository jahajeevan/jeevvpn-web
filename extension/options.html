<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
      body { color: #0b1220; background: #eef1f8; padding: 40px 20px; }
      .wrap { max-width: 420px; margin: 0 auto; background: #fff; border: 1px solid rgba(13,22,45,0.08); border-radius: 22px; padding: 28px; box-shadow: 0 20px 50px -24px rgba(16,24,40,0.3); }
      h1 { font-size: 20px; letter-spacing: -0.02em; }
      p { font-size: 13px; color: #55607a; margin-top: 4px; }
      label { display: block; margin-top: 16px; font-size: 13px; font-weight: 600; color: #55607a; }
      input, select { width: 100%; margin-top: 6px; padding: 10px 12px; font-size: 14px; border: 1px solid rgba(13,22,45,0.1); border-radius: 12px; background: #f7f9fc; }
      input:focus, select:focus { outline: none; border-color: rgba(0,184,102,0.5); box-shadow: 0 0 0 4px rgba(0,184,102,0.14); }
      button { margin-top: 22px; padding: 11px 20px; font-size: 14px; font-weight: 700; color: #04140d; background: linear-gradient(180deg,#14d47c,#00a15a); border: 0; border-radius: 999px; cursor: pointer; }
      #saved { margin-left: 12px; font-size: 13px; color: #00a15a; font-weight: 600; }
      .hint { font-size: 12px; color: #8a94a6; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>JeevVPN settings</h1>
      <p>Enter the server details your admin gave you.</p>

      <label>Server address <input id="host" placeholder="52.140.121.205" /></label>
      <label>Port <input id="port" type="number" placeholder="8443" /></label>
      <label>Security
        <select id="scheme">
          <option value="http">Standard (http)</option>
          <option value="https">Stealth (https / TLS)</option>
          <option value="socks5">SOCKS5</option>
        </select>
      </label>
      <label>Username <input id="username" autocomplete="off" /></label>
      <label>Password <input id="password" type="password" autocomplete="off" /></label>

      <div><button id="save">Save</button><span id="saved"></span></div>
      <p class="hint">Tip: use “Stealth (https)” once your server has TLS on 443 — it slips past campus filters.</p>
    </div>
    <script src="options.js"></script>
  </body>
</html>
